name: Java CI/CD Pipeline

on:
  push:
    branches: [ main, master, main-secondary ]
  pull_request:
    branches: [ main, master, main-secondary ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build and package JAR
        run: ./gradlew bootJar -x test

      - name: Run unit tests
        run: mvn test || true

      - name: Upload Executable JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: "**/build/libs/*.jar"
          if-no-files-found: warn
          retention-days: 30

      - name: Verify JAR artifact exists
        run: ls -la target/*.jar

      - name: Create Dockerfile if not present
        run: |
          if [ ! -f Dockerfile ]; then
          cat > Dockerfile << 'DEOF'
          FROM eclipse-temurin:17-jre-jammy
          WORKDIR /app
          COPY target/*.jar app.jar
          EXPOSE 8080
          ENTRYPOINT ["java", "-jar", "app.jar"]
          DEOF
          fi

      - name: Lowercase image name for GHCR
        run: echo "IMAGE_NAME=ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
